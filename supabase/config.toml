# Local development only. CLI 2.116.0; never link this workspace to a remote.
# No business seeds. Structural seeds are part of the versioned migrations.
project_id = "casa-albor-bootstrap"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 55422
shadow_port = 55420
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[realtime]
enabled = false

[storage]
enabled = true
file_size_limit = "6MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = false
enable_anonymous_sign_ins = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
